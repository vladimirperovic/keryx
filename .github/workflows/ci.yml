name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Keep the historical check names required by the existing main-branch rule,
    # while mapping them to maintained Node.js runtimes.
    name: build (${{ matrix.required_context }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - required_context: 20
            node: 22
          - required_context: 22
            node: 24
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck, build and test
        run: npm run check
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  docker:
    name: Docker and Compose
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Validate Compose configuration
        run: docker compose config
      - name: Build image
        run: docker build --tag keryx:ci .
