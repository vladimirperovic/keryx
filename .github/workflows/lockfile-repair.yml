name: Lockfile Repair Preview

on:
  push:
    branches:
      - agent/keryx-security-hardening

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Refresh vulnerable transitive dependencies
        run: npm audit fix --package-lock-only
      - name: Verify no high-severity production advisories
        run: npm audit --omit=dev --audit-level=high
      - name: Upload repaired lockfile
        uses: actions/upload-artifact@v4
        with:
          name: repaired-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1
