name: Lockfile Repair Commit

on:
  push:
    branches:
      - agent/keryx-security-hardening

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: agent/keryx-security-hardening
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Refresh vulnerable transitive dependencies
        run: npm audit fix --package-lock-only || true
      - name: Verify no high-severity production advisories
        run: npm audit --omit=dev --audit-level=high
      - name: Commit repaired lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(deps): refresh audited lockfile"
          git push origin HEAD:agent/keryx-security-hardening
