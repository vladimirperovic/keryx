services:
  keryx:
    build:
      context: .
    ports:
      # Secure default: expose only to the host/reverse proxy.
      - "${KERYX_BIND_ADDRESS:-127.0.0.1}:${PORT:-3000}:3000"
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 100
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks:
      - keryx-net

networks:
  keryx-net:
    driver: bridge
